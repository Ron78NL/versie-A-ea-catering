// Volgorde van het menu
const categorieen = [
    "Bouillons",
    "Snijtechnieken",
    "Groenten & Fruit",
    "Vlees & Vis",
    "Sauzen",
    "Bereidingstechnieken",
    "Keukenapparatuur",
    "Bakkerij & Patisserie",
    "Mise en Place"
];

const standaardTitel = "📚 KEUKENTECHNIEKEN";
let geselecteerdeCategorie = "";

const videoGrid = document.getElementById("videoGrid");
const searchInput = document.getElementById("searchInput");
const resultCount = document.getElementById("resultCount");
const categoryPanel = document.getElementById("categoryPanel");
const categoryHeader = document.getElementById("categoryHeader");
const categoryMenu = document.getElementById("categoryMenu");

function bouwMenu() {
    const items = [{ naam: "Alle video's", waarde: "" }]
        .concat(categorieen.map(c => ({ naam: c, waarde: c })));

    items.forEach(item => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cat-btn" + (item.waarde === "" ? " active" : "");
        button.textContent = item.naam;
        button.dataset.category = item.waarde;

        button.addEventListener("click", () => {
            geselecteerdeCategorie = item.waarde;
            categoryHeader.textContent = item.waarde === ""
                ? standaardTitel
                : "📚 " + item.waarde.toUpperCase();

            updateMenu();
            filterVideos();
        });

        categoryMenu.appendChild(button);
    });
}

// Is er een categorie gekozen, dan verdwijnen alle andere categorieën.
// Alleen de gekozen categorie en een terugknop blijven zichtbaar.
function updateMenu() {
    categoryMenu.querySelectorAll(".cat-btn").forEach(b => {
        const isAlle = b.dataset.category === "";
        const isGekozen = b.dataset.category === geselecteerdeCategorie;

        b.classList.toggle("active", isGekozen);

        if (geselecteerdeCategorie === "") {
            b.hidden = false;
            b.textContent = isAlle ? "Alle video's" : b.dataset.category;
        } else {
            b.hidden = !(isGekozen || isAlle);
            if (isAlle) b.textContent = "← Alle categorieën";
        }
    });
}

function toonVideos(lijst) {
    videoGrid.innerHTML = "";

    lijst.forEach(video => {
        const card = document.createElement("div");
        card.className = "video-card";

        const link = document.createElement("button");
        link.type = "button";
        link.className = "video-link";
        link.setAttribute("aria-label", video.title + " afspelen");
        link.addEventListener("click", () => openVideo(video));

        const image = document.createElement("img");
        image.src = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;
        image.alt = video.title;
        image.loading = "lazy";
        image.onerror = function () {
            this.onerror = null;
            this.src = `https://img.youtube.com/vi/${video.id}/default.jpg`;
        };

        const title = document.createElement("h3");
        title.textContent = video.title;

        link.appendChild(image);
        link.appendChild(title);
        card.appendChild(link);
        videoGrid.appendChild(card);
    });
}

function filterVideos() {
    const zoekterm = searchInput.value.toLowerCase().trim();

    const gefilterd = videos.filter(video => {
        const titelMatch = video.title.toLowerCase().includes(zoekterm);
        const categorieMatch =
            geselecteerdeCategorie === "" ||
            video.category === geselecteerdeCategorie;
        return titelMatch && categorieMatch;
    });

    toonVideos(gefilterd);
    resultCount.textContent = `${gefilterd.length} video's gevonden`;
}

bouwMenu();
filterVideos();
searchInput.addEventListener("input", filterVideos);

// Video afspelen op de pagina zelf
const videoModal = document.getElementById("videoModal");
const videoFrame = document.getElementById("videoFrame");
const videoExtern = document.getElementById("videoExtern");
const videoClose = document.getElementById("videoClose");

function openVideo(video) {
    videoFrame.innerHTML = "";

    const iframe = document.createElement("iframe");
    iframe.src = `https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    iframe.title = video.title;
    iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    iframe.allowFullscreen = true;
    videoFrame.appendChild(iframe);

    videoExtern.href = `https://www.youtube.com/watch?v=${video.id}`;
    videoModal.classList.add("open");
    document.body.style.overflow = "hidden";
}

function closeVideo() {
    videoModal.classList.remove("open");
    videoFrame.innerHTML = ""; // stopt het afspelen
    document.body.style.overflow = "";
}

videoClose.addEventListener("click", closeVideo);
videoModal.addEventListener("click", e => {
    if (e.target === videoModal) closeVideo();
});
document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeVideo();
});

// Maakt installeren op het startscherm en snel openen mogelijk
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
    });
}
